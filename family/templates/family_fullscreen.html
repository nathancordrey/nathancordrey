<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>{{ title }} · Spread {{ spread }}</title>
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:16px system-ui,-apple-system,sans-serif;color:#fff;background:#111;overscroll-behavior:none}
.viewer{position:fixed;inset:0;display:flex;flex-direction:column;height:100vh;height:100dvh;background:#111}
.toolbar{position:relative;z-index:2;flex:none;min-height:58px;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1b1b1b}
.toolbar .count{font-weight:650;text-align:center;font-size:.93rem;line-height:1.3}
a{color:inherit}.close{min-height:44px;min-width:82px;display:inline-flex;align-items:center;justify-content:center;border:1px solid #777;border-radius:8px;padding:8px 12px;text-decoration:none}
.close:focus-visible,.turn:focus-visible{outline:3px solid #bddcc9;outline-offset:3px}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative;touch-action:none;user-select:none;cursor:grab}
.stage:active{cursor:grabbing}
.stage img{display:block;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;transform-origin:center center;will-change:transform;pointer-events:none;-webkit-user-drag:none;user-select:none}
.navigation{z-index:2;flex:none;padding:9px max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1b1b1b}
.turn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;min-width:95px;padding:8px 12px;border:1px solid #777;border-radius:8px;text-decoration:none}
.turn.disabled{opacity:.35;pointer-events:none}
.hint{font-size:.78rem;color:#ccc;text-align:center;line-height:1.4}
@media(max-width:520px){.navigation .hint{font-size:.72rem}.turn{min-width:77px;padding:8px}}
@media(prefers-reduced-motion:reduce){.stage img{will-change:auto}}
</style></head>
<body><main class="viewer" id="fullscreen-viewer">
<header class="toolbar">
<a class="close" id="close-viewer" href="{{ close_url }}" aria-label="Return to album spread {{ spread }}">✕ Close</a>
<div class="count">{{ title }}<div>Spread {{ spread }} of {{ spread_count }}</div></div>
<div style="min-width:82px" aria-hidden="true"></div>
</header>
<div class="stage" id="image-stage" aria-label="Album spread; use two fingers to zoom or one finger to swipe">
<img id="spread-image" alt="Album spread {{ spread }} of {{ spread_count }}" src="{{ image_url }}" draggable="false">
</div>
<nav class="navigation" aria-label="Browse album spreads">
{% if previous_url %}<a class="turn" id="previous-spread" href="{{ previous_url }}">← Previous</a>{% else %}<span class="turn disabled" aria-hidden="true">← Previous</span>{% endif %}
<span class="hint">Pinch to zoom<br>Swipe to change spreads</span>
{% if next_url %}<a class="turn" id="next-spread" href="{{ next_url }}">Next →</a>{% else %}<span class="turn disabled" aria-hidden="true">Next →</span>{% endif %}
</nav>
</main>
<script src="{{ url_for('family.static',filename='fullscreen.js') }}" defer></script>
</body></html>
